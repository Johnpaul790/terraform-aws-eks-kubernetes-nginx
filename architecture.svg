<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif">
  <title id="diagram-title">AWS EKS with Terraform: Kubernetes NGINX deployment architecture</title>
  <desc id="diagram-description">AWS eu-central-1, Frankfurt. VPC myapp-vpc uses example CIDR 10.0.0.0/16. Public subnets 10.0.4.0/24, 10.0.5.0/24, 10.0.6.0/24 contain the internet-facing AWS load balancer and a single NAT Gateway. Private subnets 10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24 host the dev EKS managed node group with three desired t3.micro workers, minimum one and maximum three, using AL2023_x86_64_STANDARD. The nginx LoadBalancer Service routes HTTP port 80 to one nginx:1.30.6 Pod, maintained by the nginx Deployment. The MacBook uses the public Kubernetes API over HTTPS 443. Worker outbound internet connections use NAT, separately from inbound web traffic. Worker placement among individual subnets is not prescribed. Mermaid version: architecture.mmd.</desc>
  <rect x="0" y="0" width="1440" height="1240" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" />
  <text x="48" y="55" font-size="32" font-weight="700" fill="#0f172a">AWS EKS with Terraform</text>
  <text x="48" y="86" font-size="18" font-weight="400" fill="#475569">Kubernetes NGINX deployment / eu-central-1 (Frankfurt)</text>
